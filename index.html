<body>
<canvas id="sand" role="img" aria-label="Plateau de sable"></canvas>
<div id="ui"></div>
<noscript><p style="margin:0;padding:40vh 24px 0;text-align:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f4ecdf">Sable a besoin de JavaScript.</p></noscript>
<script>
/* ==== src/core.js ==== */
// Shared namespace + tiny utils. Owner: lead. Keep minimal.
(function () {
  'use strict';
  const SAND = (window.SAND = window.SAND || {});
  SAND.MM_PER_CSS_PX = 0.16;
  SAND.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  SAND.lerp = (a, b, t) => a + (b - a) * t;
  // Grid dimensions for a natural-frame viewport of wCss x hCss CSS px.
  // `cells` = cell budget (the app picks it from a quick speed test of the device: 50k slow ... 110k fast).
  SAND.gridFor = function (wCss, hCss, cells) {
    cells = cells > 20000 ? cells : 70000;
    const cellCss = Math.max(2.6, Math.sqrt((wCss * hCss) / cells));
    const W = Math.max(8, Math.round(wCss / cellCss)), H = Math.max(8, Math.round(hCss / cellCss));
    return { W, H, cellMM: (wCss / W) * SAND.MM_PER_CSS_PX, cellCss: wCss / W };
  };
})();

/* ==== src/sim.js ==== */
// SABLE physics — dry-sand heightfield simulator.  Owner: physics.
//
// MODEL (two coupled scales, both exactly mass-conserving, both isotropic):
//
//  1. BULK (inertial) flow — answers the motion of the device (tilt, jolt, shake).
//     Depth-averaged Savage–Hutter granular flow on a coarse staggered grid (COARSE x COARSE fine
//     cells per coarse cell; heights at cell centres, velocities on faces):
//         du/dt + (u.grad)u = G gz (t - grad h)/sqrt(1+|grad h|^2)  -  G gn mu(|u|) u/|u|
//     t = in-plane gravity / gz,  gn = load normal to the sand surface.  Coulomb friction with
//       * static > dynamic friction (flow starts ~35 deg, stops ~30 deg), evaluated with the *exact*
//         slope against the true horizontal, so piles rest at the right angle whatever the tilt;
//       * a mu(I)-like rise of friction with speed (terminal velocities: the sand reads as heavy),
//         a small velocity-weakening branch near zero speed (flows stop abruptly, no creep),
//         extra friction for films of a few grains, and smooth per-cell noise (lobed fronts);
//       * coherent stopping and "agitation" (sand that flows, or just did, keeps its neighbours at
//         dynamic friction), so deposits settle at the repose angle without frozen shock ridges.
//     Explicit forward-backward substeps (wave CFL), semi-Lagrangian advection of the velocities
//     and a conservative cell-integrated remap of the mass: any advective CFL, closed walls.
//     The fine grid is the single source of truth: each frame the coarse surface is restricted
//     from it (hat weights), and at the end of the frame the fine height field is remapped,
//     conservatively, with the composed displacement of all substeps (quadratic B-splines) —
//     furrows and ripples really travel with the flow, slam into the wall and pile up.
//     Where that map converges too hard (a fast flow slamming into a wall or a pile) the sand stops
//     short instead of being squeezed (a bore), and a front running over bare floor is translated.
//     The tray has a lid (H_LID): no column stands higher, the excess is passed on away from the low wall,
//     and nothing flows into a full cell.  Tilts are followed up to T_MAX (72 deg; beyond it the pull keeps
//     its strength): a steeply held tray shows a compact block of sand against its low wall with a short
//     free surface at the angle of repose, and a bare floor above it.
//     Films of a few grains feel extra friction in patches (sticky / slippery floor): the trailing edge of
//     an avalanche is lobed and leaves stragglers; elsewhere such films run off whole (no long thin tail).
//
//  2. LOCAL (quasi-static) avalanche relaxation on the fine grid — finger-sized features.
//     Hysteretic, isotropic slope-limited flux   q = D(sigma) S,   D = max(0, 1 - mu/sigma),
//     sigma = exact slope against the true horizontal, mu switching from static to dynamic
//     friction where sand has just moved.  Runs only in awake 16x16 tiles.  It gives crisp furrow
//     rims / pit walls at the angle of repose and finishes what the bulk flow leaves.
//
//     Flowing sand mixes (mixMoved): relief carried by the flow is diffused in proportion to the distance
//     travelled, and where the flow converges (deposits, bores, slams) the fine field is relaxed towards
//     the smooth (C1 B-spline) version of its own coarse means, so that piles grow without per-frame
//     terraces or facets at the coarse spacing.  Patches of lower dynamic friction give lobed fronts.
//
//     A back-and-forth shake (detected from reversals of the in-plane vibration, OSC_*) is not followed as a quasi-static
//     tilt: the bed only feels the mean orientation and "boils" instead: an isotropic, flux-form diffusion of the surface
//     towards a gently undulating, slowly drifting target (SH_*), plus a relaxation of its smooth tray-scale modes, levels
//     a drawing within a shake or two with no trace of the grid (no plaid, no ghost bars, never a mirror).
//
//  3. Vibro-fluidisation from the *amplitude* of the vibration: gravity is high-passed (~4 Hz), peak-held
//     and thresholded (nothing below ~0.3 g, full at ~1.1 g).  A trembling hand, taps on the glass, walking
//     or a haptic buzz leave a drawing alone; a real shake softens (0.5 g) or levels (1-1.5 g) the bed.
//     The local relaxation loses its friction when fluidised, the bulk flow keeps at least 55 % of it (a
//     shaken bed stays a frictional, gently undulating surface, not a liquid).  Vibration also lowers the
//     START threshold a little (never the stop threshold), and while the tray is being re-oriented a few
//     grains let go just below the static angle (precursor slides): the sand "ticks" in the hand.
//
//  4. Touch (see DESIGN.md, round 1): the app passes the real contact radius and force 0..1, or -1 when
//     the device has no pressure sensor (the force then follows dwell and speed: a landing pause adds a little, which
//     fades out smoothly over PRESS_FADE_MM of path; only a finger resting > DEEP_DELAY presses through to the floor).
//     Ease-in, press fade and reference surface are evaluated per sub-stamp along the path, so the groove does not
//     depend on the frame or event rate (a whole stroke in one touchMove still starts with a short tapered entry).  The tip is a shallow
//     spherical cap (radius clamp(0.42 r, 1.9, 4) mm) that meets a "cone of collapse" at the angle of
//     repose tangentially: U-shaped troughs.  The finger rides on the surface *as it was when it landed*
//     (a snapshot per touch): it follows slopes, and the cone of collapse is cut relative to that surface, so
//     a stroke on a slope or on a thin film is the same groove as on a level bed (the old surface is never
//     cut outside the lip; only sand heaped up on it is levelled off and rounded).  Depth is absolute
//     (1.5 mm at force 0.5) and may reach
//     "below" the floor (a bare strip of finite width).  The tool is swept along the exact path (capsule:
//     no gaps at any speed); everything above it is removed and re-deposited, volume-exact, as a forward
//     crescent (bow wave) that is ploughed again and again until it escapes sideways as levees.  The cone
//     flattens out at levee height (rounded crests); depth, wall slope and deposit carry slow noise (no
//     extruded look).  'rake' = 5 tines, each with its own little levees.
//
//  Renderer support: travel / dispX / dispY advance by the surface displacement (mm) only where
//  sand moves; speed is a smoothed surface speed (mm/s), exactly 0 at rest; version bumps when (and only when)
//  h / travel / disp / speed were written; step() returns true only then (or while a finger moves), and costs
//  ~nothing when the tray is at rest.  level(kind) animates a ~0.7 s settle (level(kind, true): instant).
//
// Units: mm, s, heights in mm; gravity in g.  Frames: see DESIGN.md.
(function () {
  'use strict';
  const SAND = (window.SAND = window.SAND || {});

  // ------------------------------------------------------------------------------------------
  // Tunable constants
  // ------------------------------------------------------------------------------------------
  const P = {
    G: 9810,                 // mm/s^2 per g
    // --- friction ---
    MU_S: Math.tan(33.0 * Math.PI / 180),   // static friction: flow starts above this slope
    MU_D: Math.tan(26.8 * Math.PI / 180),   // dynamic (sliding) friction; with STOP_BOOST and the thin-film term flows stop near 30 deg
    MU_2: 1.25,              // friction at high speed (mu(I)-like), gives terminal velocities
    S0: 170,                 // mm/s, speed scale of the friction increase
    NOISE_A1: 0.035,         // friction noise amplitude (large blobs, ~7 mm)
    NOISE_L1: 7.0,           // mm
    NOISE_A2: 0.015,         // friction noise amplitude (small blobs, ~2 mm)
    DYN_A1: 0.10, DYN_L1: 13,   // patches of lower *dynamic* friction in the bulk flow (depth of the dip, wavelength mm): lobed fronts
    DYN_A2: 0.05, DYN_L2: 5,
    MUD_DRIFT: 0, MUD_DRIFT_FRAC: 0.12,   // (experimental, off: let those patches travel with the mean flow of a real avalanche - it can leave a
                             //  limit cycle at a wall under a steep tilt, see the round-3 notes)
    FAN: 0.25,               // local avalanches: per-cell variation of the flux (channels fan out)
    MICRO: 0.08,             // mm: micro-relief of a "flat" bed (nothing in sand is a mathematical plane)
    DUNE_PP: 1.6,            // mm: peak-to-peak relief of level('dunes') on a 6 mm bed ...
    DUNE_SLOPE: 0.48,        // ... unless its steepest slope (26 deg) would exceed this (nothing may creep under hand tremor)
    LEVEL_TIME: 0.7, LEVEL_SPREAD: 0.4, LEVEL_DISP: 6, LEVEL_D: 9,   // level(): duration (s), spread of the local start times (fraction), grain travel
                             //   per mm of height change, slumping of the old relief (mm^2/s)
    START_VIB: 0.8, START_MAX: 0.10,   // vibration lowers the START threshold only: 1 - min(START_MAX, START_VIB * (amplitude[g] - START_DEAD))
    START_DEAD: 0.02,        // g: vibration below this (sensor noise, a steady hand) does not count
    PRECURSOR: 1.0,          // spontaneous small slides just below the static angle: chance per cell = PRECURSOR * change of tilt * u^3 ...
    PREC_TILT: 0.035,        // ... each time the tilt (as a slope) has changed by this much (2 deg): the sand "ticks" in a moving hand
    NOISE_L2: 2.0,           // mm
    // --- gravity conditioning ---
    GZ_MIN: 0.10,            // clamp of the normal gravity component (face-down / free fall)
    T_MAX: 3.0,              // cap of the tilt |g_inplane / gz| seen by the sand (72 deg): beyond it the pull keeps its strength
                             // and direction but the bed behaves as at this tilt
    H_LID: 22,               // mm: the tray has a lid (the glass): sand that would rise higher is passed on, away from the low wall
    G_MAX: 4.0,              // clamp of each gravity component (g)
    FREEFALL: 0.3,           // |g| below which the in-plane pull is faded out (the device is falling / being tossed)
    // --- vibro-fluidisation ---
    GB_TAU: 0.04,            // s: high-pass of the gravity signal (removes tilt and slow rotation below ~4 Hz)
    GB_ZW: 1.5,              // weight of the component normal to the tray (it unloads the grain contacts)
    GB_HOLD: 0.10,           // s: peak-hold of the vibration amplitude
    GAMMA0: 0.30,            // g: vibration amplitude below which nothing is fluidised (tremor, taps, walking, haptics)
    GAMMA1: 1.10,            // g: amplitude of full fluidisation
    FL_RISE: 0.05,           // s: rise time of the fluidisation
    FL_TAU: 0.30,            // s: decay time of the fluidisation
    FL_KB: 0.45,             // friction lost by the *bulk* flow at full fluidisation (a shaken bed stays frictional)
    JOLT_TIME: 0.15,         // s after a fast change of gravity during which the local relaxation is still accelerating
    SCAN_FLOOR: 0.015,       // change of tilt (as a slope) below which a resting bed is never re-examined (sensor noise)
    FL_SUSTAIN_TAU: 0.35,    // s: build-up of the 'sustained shaking' level
    FL_SUSTAIN_DECAY: 0.9,   // s: ... and its decay (the bed stays liquid long enough to level)
    FL_JOLT: 0.45,            // share of the fluidisation a single jolt gets (the rest needs sustained shaking)
    FL_DECOUPLE: 0.7,        // how much a sustained shake decouples the bed from the fast in-plane motion
    OSC_G: 0.2,              // g: in-plane vibration lobes above this count as half-cycles of a shake ...
    OSC_TAU: 0.3,            // s: ... remembered this long; from the 3rd reversal on, the bed no longer follows the fast back-and-forth
    OSC_N0: 1.25, OSC_N1: 1.0, // (decoupling = smoothstep((decayed count of reversals - N0) / N1))
                             //    (it boils in place and levels instead of sloshing as a block; a single jolt still throws it)
    SH_D: 6.0,               // mm^2/s: isotropic diffusion of the surface at full fluidisation (grains hopping in a shaken bed) ...
    SH_FE0: 0.04,            // ... starting above this effective fluidisation (ordinary handling stays harmless)
    SH_NOISE: 0.10,          // mm: rms of the gentle, isotropic, slowly drifting undulation a shaken bed tends to (never a mirror)
    SH_NOISE_L0: 8, SH_NOISE_L1: 28,   // mm: its range of wavelengths
    SH_MODES_X: 8, SH_MODES_Y: 17, SH_MODES_RATE: 3.0,   // tray-scale modes that relax (1/s) towards the level of the mean gravity while shaken
    G_MEAN_TAU: 0.5,         // s: low-pass giving the mean orientation of the device
    //      // the bulk flow never gets more fluid than this level of fluidisation
    G_TAU: 0.035,            // s, low-pass of the in-plane gravity acting on the sand
    FL_DRAG: 6,              // 1/s: viscous damping of the bulk flow while fluidised (kills water-like ringing)
    FL_K: 1.0,               // friction is multiplied by (1 - FL_K * fluid)
    // --- bulk (coarse) solver ---
    BULK: 1,                 // 0 disables the inertial bulk solver (debug)
    D_MIN: 0.02,             // fine cells: smaller frame displacements of a whole line are dropped
    BULK_GATE_OVER: 1.25,    // ... unless the (smoothed) slope exceeds the static one by this factor
    BULK_GATE_NEAR: 1.12,    // ... or by this factor next to sand that already moves (slides set off by a finger stay local and fan out)
    BULK_GATE: 0.10,         // |g_inplane/gz| below which resting sand is left to the local relaxation
    COARSE: 8,               // fine cells per coarse cell (per axis)
    CFL: 0.9,                // wave CFL of the explicit bulk substeps
    NSUB_MAX: 10,            // max bulk substeps per coarse step (beyond: pressure is softened)
                 // implicitness of the pressure filter (lambda = THETA*c*dt)
    S_STOP: 15,              // mm/s: below this speed friction rises again (flows stop abruptly, no endless creep)
    STOP_BOOST: 0.10,        // relative friction increase at zero speed
    H_THIN: 1.2,             // mm: films thinner than this (a few grains) feel extra friction and stop (h_stop)
    FILM_B0: 0.42, FILM_B1: 0.55,   // ... by a factor 1 + B (1 - h / H_THIN), B = B0 + B1 * noise in patches (sticky and slippery floor:
    FILM_L1: 18, FILM_L2: 6,        //     lobed, straggling trailing edges), noise wavelengths in mm
    V_MIN: 3.0,              // mm/s: below this speed a flow only survives if it accelerates by at least
    SLOW_TIME: 0.06,         // s: ... and never for longer than this
    A_MIN: 80,               // mm/s^2 (otherwise it stops: no endless creep at the threshold)
    DEAD_MARGIN: 0.06,       // a face stopped by those rules only restarts when the yield limit is exceeded by this fraction (more each time)
    AGIT_MARGIN: 0.04,       // ... plus this margin (a face shaken loose must really accelerate)
    ACT_TIME_BULK: 0.25,     // s: sand that just stopped keeps dynamic friction this long (deposits settle at the repose angle)
    S_AGIT: 25,              // mm/s: neighbouring flow of this speed lowers static friction to the dynamic value
    VISC: 0.12,              // momentum diffusion number per bulk substep
    P_SAT: 1.0,              // surface slope up to which the exact 1/sqrt(1+|grad h|^2) projection is used; steeper fronts (bores
                             // against a wall) keep the full hydrostatic push, or incoming sand could be squeezed into the wall
    SQUEEZE: 2.0,            // largest compression of the sand column per frame and axis in the fine remap: where the flow
                             // converges harder (a fast flow slamming into a wall or a pile) it stops short instead (a bore)
    FRONT_RATIO: 0.35,       // sand ahead of a flow that is thinner than this fraction of it is its toe: pushed along, not squeezed
    MIX_COARSE: 0.13,        // coarse diffusion number per coarse cell travelled (~0.5 mm^2 per mm): relief carried by a flow dissolves
    MIX_FINE: 0,             // optional fine pairwise exchange per coarse cell travelled (off: no measurable gain for its cost)
    DEPOSIT_SMOOTH: 1.5,     // relaxation of the fine field towards its coarse interpolation per unit convergence of the flow (deposits)
    DEPOSIT_DIFF: 0.2,       // coarse diffusion number per frame where the fine field is fully relaxed (takes the 2-cell mode out of deposits)
    DEPOSIT_SETTLE: 0.12,    // ... and of sand that has just been thrown (per frame, fading over SETTLE_FRAMES after the fast flow)
    SETTLE_SPEED: 25, SETTLE_FRAMES: 45,   // mm/s that counts as "thrown"; frames the settling lasts
    U_MAX: 1600,             // mm/s speed clamp
    H_DRY: 0.03,             // mm, coarse columns thinner than this do not flow
    YIELD_TOL: 0.004,        // slope tolerance when (re)waking resting sand
    // --- local (fine) relaxation ---
    LOCAL_MARGIN: 0.12,      // local relaxation stops this much (relative) above the bulk stopping slope
    LOCAL_TOL: 0.03,         // relative slope excess below which the local flux is cut (no asymptotic creep)
    OMEGA: 0.92,             // relaxation factor of the slope-limited flux (<= 1)
    ITER_RATE: 200,          // relaxation iterations per second (when few cells are active)
    ITER_MAX: 6,
    V_SKIP: 10,              // mm/s: tiles under a bulk flow faster than this skip the local relaxation
    ITER_BUDGET: 30000,      // cell-iterations per step of the local relaxation
    ITER_BUDGET_BULK: 2500,   // ... while a bulk flow is running (it costs time too)
    ITER_BUDGET_SHAKE: 1200, // ... while the bed is fluidised (everything is awake and nothing needs to be exact)
    //     // cell-iterations per step budget (limits iterations when a lot is awake)
    ACT_TIME: 0.14,          // s, how long sand that just moved keeps dynamic friction
    FLOW_DEPTH: 0.55,        // mm, thickness of the layer assumed to carry the local flux (travel scaling)
    EPS_FLUX: 2e-3,          // mm, face transfers below this do not keep a tile awake
    EPS_ACT: 1.5e-3,         // mm, face transfers above this mark the sand as "moving"
    TILE: 16,
    TILE_HOLD: 5,            // steps a tile stays awake after its last activity
    // --- touch ---
    WALL_SLOPE: Math.tan(30.5 * Math.PI / 180),  // slope of the collapse cone around the finger (just inside dynamic repose)
    WALL_NOISE: 0.20,        // the walls are up to this much shallower than the cone where the friction noise field is low (no ruled walls)
    RIM_SLOPE: 0.36,         // target outer slope of the berms
    BERM_REACH: 1.7,         // reach of the side deposit / width of a triangular berm of the same volume
    RIM_FLARE: 1.0,          // sand heaped up beside the tool is levelled off at about this * levee height above the old surface
    CREST_ROUND: 0.3,        // smoothing of that sand per stamp (rounded crests)
    CARVE_REACH: 22,         // mm: farthest the collapse cone is followed from the tool axis (slopes, piles)
    TIP_K: 0.30, TIP_MIN: 1.3, TIP_MAX: 2.6,   // radius of the finger tip (mm) = clamp(TIP_K * contact radius): 4.5 -> 1.9, 5.5 -> 2.3, 7 -> 2.9, 9 -> 3.8
    TIP_FLAT: 0.72,          // half-width of the rounded bottom it leaves / tip radius
    RADIUS_MIN: 3, RADIUS_MAX: 9, RADIUS_DEF: 5.5,   // contact radius accepted from the app (mm)
    BOW_FWD: 0.50,          // reach of the deposit straight ahead / reach to the sides (slow strokes): the end mound
    DEPTH_0: 0.35,           // indentation depth (mm, absolute) = DEPTH_0 + DEPTH_1 f + DEPTH_5 f^5
    DEPTH_1: 1.10,           //   -> 1.5 mm at force 0.5, 3.4 mm at 0.75, floor of a 6 mm bed from force ~0.9
    DEPTH_5: 7.50,
    PRESS_THROUGH: 1.5,      // mm the tip may go "below" the floor: a hard press bares a strip of finite width
    DEPTH_JITTER: 0.05,      // relative depth jitter along the path ...
    JITTER_MM: 7.0,          // ... correlated over this path length
    DEPOSIT_NOISE: 0.22,     // relative noise on the deposit weights
    AUTO_FORCE: 0.5,         // force used when the app passes force = -1 (no pressure sensor) ...
    PRESS_DELAY: 0.06,       // ... rising after this dwell (s) ...
    PRESS_RATE: 2.9,         // ... at this rate (1/s) by up to ...
    PRESS_GAIN: 0.08,        // ... this much (a landing pause adds a little; 0.75 after ~0.4 s)
    PRESS_FADE_MM: 25,       // a dwell-press fades out smoothly (and monotonically) over this path length once the finger moves
    DEEP_DELAY: 1.1,         // s: only a finger that has been resting longer than this presses through ...
    DEEP_RATE: 8.0,          // ... (rising at this rate, 1/s) ...
    DEEP_GAIN: 0.5,          // ... by this much more force (floor of a 6 mm bed from ~0.7 s)
    DEEP_FADE_MM: 40,        // ... and that deep press fades over this path length (a bare strip that tapers)
    STILL_SPEED: 10,         // mm/s below which the finger counts as resting
    FAST_SPEED0: 150, FAST_SPEED1: 400, FAST_DROP: 0.15,   // swipes: force drops by FAST_DROP between these speeds
    BOW_EDGE: 3.0,           // mm: the crescent fades in over this distance ahead of the tool centre line
    BOW_POW: 0.45,            // exponent of the bow-wave crescent (see deposit())
    EASE_TAU: 0.045,         // s: the tip sinks in with this time constant (a tap is shallower than a press)
    EASE_MM: 1.5,            // mm: ... or over this path length when the finger lands moving (no long pointed stroke starts)
    STEP_MM: 1.6,            // max sub-step length of a stroke (deposit spacing)
    SPRAY_K: 0.30,           // extra throw distance = SPRAY_K * v^2 / G
    SPRAY_MAX: 14,           // mm
    RAKE_TINES: 5,
    RAKE_SPACING: 0.55,      // * contact radius
    RAKE_TINE: 0.42,         // mm: half-width of a tine tip
    RAKE_DEPTH: 0.6,         // mm at force 0.5 (scales with 0.5 + force)
    FLOW_VREF: 60,           // mm/s: all the sand moving at this speed = flow index 1 before compression
    IMPACT_A0: 80,           // mm/s^2: mean deceleration of the whole bed below which nothing is reported (gentle stops)
    IMPACT_AREF: 600,        // mm/s^2: mean deceleration above IMPACT_A0 that gives impact 0.5 (x/(1+x) compression)
    TOUCH_REF: 2500,         // mm^3/s ploughed that gives touch ~0.63
  };
  SAND.SIM_PARAMS = P;

  // ------------------------------------------------------------------------------------------
  // small helpers
  // ------------------------------------------------------------------------------------------
  function hash2(ix, iy, seed) {
    let n = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967295;
  }
  function vnoise(x, y, seed) {       // smooth value noise in [-1, 1]
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed), c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
    return 2 * (a + (b - a) * fx + (c - a + (a - b - c + d) * fx) * fy) - 1;
  }
  const fin = (x, d) => (x === x && x !== Infinity && x !== -Infinity ? x : d);

  SAND.createSim = function (opts) {
    opts = opts || {};
    const sim = {
      W: 0, H: 0, cellMM: 1, depthMM: fin(+opts.depthMM, 9) > 0 ? fin(+opts.depthMM, 9) : 9,
      h: null, travel: null, dispX: null, dispY: null, speed: null,
      version: 1,
      stats: { flow: 0, impact: 0, touch: 0, mass: 0 },
    };

    // ---------------- fine grid ----------------
    let W = 0, H = 0, N = 0, cell = 1, inv = 1;
    let h, travel, dispX, dispY, speed;

// translated by its own offset and draws, whole, the grains whose centre lies nearer to it than to the other
// patches of the quad (max norm: on the regular lattice that is the patch's own square). Patches cut from the same
// picture tile without seams; grains of different patches that overlap are resolved by height; where patches have
// moved apart, a pixel no owned grain covers takes the grain whose centre lies least far past the boundary.

  // still close a gap that no owned grain covers, ranked by how far its centre lies past the boundary: a per-grain
  // priority, so a gap is closed by the outline of a whole grain, not by a sliver of an unrelated picture

float vnz(vec2 x, int seed){

      // Fade the master gain (enable / disable / hide) without clicks.

    return api;
  };

        try { audio.setEnabled(prefs.sound); if (prefs.sound) audio.unlock(); } catch (e) { /* ignore */ } });
      if (canVibrate) {
        const vib = row(ICON.vibrate, 'Vibrations', true);
        const syncVib = () => vib.setAttribute('aria-checked', String(prefs.haptics)); syncVib();
        tap(vib, () => { prefs.haptics = !prefs.haptics; savePrefs(); syncVib(); buzz(14, 0); });
      }
      const de = document.documentElement;
      const fsReq = de.requestFullscreen || de.webkitRequestFullscreen, fsExit = document.exitFullscreen || document.webkitExitFullscreen;
      let fsOk = false; try { fsOk = !!(fsReq && fsExit && (document.fullscreenEnabled || document.webkitFullscreenEnabled)); } catch (e) { fsOk = false; }
      if (fsOk) {
        const fs = row(ICON.full, 'Plein écran', true);
        const active = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
        const syncFs = () => { fs.setAttribute('aria-checked', String(active())); scheduleLayout(120); };
        syncFs(); document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
        tap(fs, () => {
          try {
            if (active()) { const p = fsExit.call(document); if (p && p.catch) p.catch(() => {}); return; }
            const p = fsReq.call(de, { navigationUI: 'hide' });
            // Where allowed (Android, fullscreen only) pin the current orientation: tilting the tray far
            // enough to start an avalanche would otherwise make the browser auto-rotate the page.
            const pin = () => { try { const o = screen.orientation, l = o && o.lock && o.lock(o.type); if (l && l.catch) l.catch(() => {}); } catch (e) { /* ignore */ } };
            if (p && p.then) p.then(pin, () => {}); else pin();
          } catch (e) { /* refused: ignore */ }
        });
      }
      panel.appendChild(c1); panel.appendChild(c2);
      // UI never digs and never lets a press fall through to the page
      [fab, panel].forEach((n) => n.addEventListener('pointerdown', (e) => e.stopPropagation()));

      // --- virtual tilt: puck + shake + lock
      const tiltBox = el('div', 'sb-tilt');
      const puck = el('div', 'sb-puck sb-glass', RINGS + '<div class="sb-bead"></div>');
      puck.setAttribute('aria-hidden', 'true');           // pointer-only control; the arrow keys are the accessible route
      ui.bead = puck.lastChild;
      let lastTap = -1e9, lastTapX = 0, lastTapY = 0;
      // event time (ms, performance.now() clock) when sane: the double-tap test does not depend on how late the handler runs
      const evTime = (e) => { const t = e.timeStamp, pn = performance.now(); return t > 0 && Math.abs(t - pn) < 5000 ? t : pn; };
      const aim = (e) => {
        const r = puck.getBoundingClientRect();
        let x = (e.clientX - (r.left + r.width / 2)) * pz / 30, y = (e.clientY - (r.top + r.height / 2)) * pz / 30;
        const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
        tilt.tx = x * PUCK_SIGN; tilt.ty = y * PUCK_SIGN; wake();
      };
      puck.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();
        const now = evTime(e);
        if (now - lastTap < 420 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 26) {   // double-tap: back to flat
          lastTap = -1e9; puckPtr = null; root.classList.remove('sb-tilting'); tilt.tx = tilt.ty = 0; setLock(false); buzz(8); wake(); hooks.debug.recentres = (hooks.debug.recentres || 0) + 1; return;
        }
        lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;
        try { puck.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        puckPtr = e.pointerId; root.classList.add('sb-tilting'); aim(e);
      });
      puck.addEventListener('pointermove', (e) => { if (e.pointerId === puckPtr) aim(e); });
      const release = (e) => {
        if (e.pointerId !== puckPtr) return;
        puckPtr = null; root.classList.remove('sb-tilting');
        if (!locked) { tilt.tx = tilt.ty = 0; } wake();
      };
      puck.addEventListener('pointerup', release); puck.addEventListener('pointercancel', release); puck.addEventListener('lostpointercapture', release);
      const shk = (ui.shk = el('button', 'sb-chip sb-glass', svg(ICON.shake) + '<span>Secouer</span>')); shk.type = 'button';
      tap(shk, shake);
      const lck = el('button', 'sb-chip sb-round sb-glass', svg(ICON.lock)); lck.type = 'button';
      function setLock(on) { locked = on; lck.setAttribute('aria-pressed', String(on)); lck.setAttribute('aria-label', on ? 'Libérer l’inclinaison' : 'Garder l’inclinaison');
        if (!on && puckPtr == null) { tilt.tx = tilt.ty = 0; } wake(); }
      setLock(false);
      tap(lck, () => { setLock(!locked); buzz(5); });
      [shk, lck].forEach((n) => n.addEventListener('pointerdown', (e) => e.stopPropagation()));
      // shown only when iOS refused the motion prompt for lack of a gesture: its click is one
      const sens = (ui.sens = el('button', 'sb-chip sb-glass sb-sens', svg(ICON.sensor) + '<span>Activer les capteurs</span>')); sens.type = 'button'; sens.hidden = true;
      tap(sens, () => { requestMotion(); try { if (prefs.sound) audio.unlock(); } catch (e) { /* ignore */ } });
      sens.addEventListener('pointerdown', (e) => e.stopPropagation());
      const rowBox = el('div', 'sb-tilt-row'); rowBox.appendChild(puck); rowBox.appendChild(shk); rowBox.appendChild(lck);
      tiltBox.appendChild(sens); tiltBox.appendChild(rowBox);

      // live diagnostic line (only refreshed while the panel is open)
      const dg = el('div', 'sb-dgl'); panel.appendChild(dg);
      let dgDraws = 0, dgT = 0, gpuStr = '';
      setInterval(() => {
        if (!root.classList.contains('sb-open') || fatal) return;
        try {
          const now = performance.now(), st = (renderer && renderer.stats) || {}, d = (st.draws || 0) - dgDraws, dtS = (now - dgT) / 1000;
          dgDraws = st.draws || 0; dgT = now;
          if (!gpuStr) { try { const c = document.createElement('canvas'), g = c.getContext('webgl2'); const x = g && g.getExtension('WEBGL_debug_renderer_info');
            gpuStr = g ? String(x ? g.getParameter(x.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER)).replace(/^ANGLE \((.*)\)$/, '$1').slice(0, 60) : '?';
            const lc = g && g.getExtension('WEBGL_lose_context'); if (lc) lc.loseContext(); } catch (e) { gpuStr = '?'; } }
          dg.textContent = (dtS > 0.2 && dtS < 3 ? Math.round(d / dtS) : 0) + ' img/s · échelle ' + (renderer && renderer.pxScale ? (+renderer.pxScale).toFixed(2) : '?') +
            ' · sim ' + simMs.toFixed(1) + ' ms · grille ' + sim.W + '×' + sim.H + ' · ' + canvas.width + '×' + canvas.height + ' · dpr ' + (+window.devicePixelRatio).toFixed(2) +
            (pz < 0.95 ? ' · zoom ' + pz.toFixed(2) : '') + ' · ' + mode + ' · ' + gpuStr;
        } catch (e) { /* ignore */ }
      }, 700);
      root.appendChild(tiltBox); root.appendChild(panel); root.appendChild(fab);
    }

    function buildIntro() {
      const intro = (ui.intro = el('div', 'sb-intro',
        '<div class="sb-card sb-glass"><h1 class="sb-title">Sable</h1>' + RAKE_LINES +
        '<p class="sb-hint">Tenez l’appareil à plat, comme un plateau.<br>Touchez, inclinez, secouez.</p>' +
        '<button type="button" class="sb-b sb-go">Toucher le sable</button></div>'));
      // Any real tap or click dismisses it (the button is simply the obvious place). Deliberately click only:
      // on iOS the touchend that ends a swipe is not a user gesture, and starting from it would lose both
      // the motion-permission prompt and the audio unlock.
      intro.addEventListener('click', (e) => { e.preventDefault(); start(true); });
      root.appendChild(intro);
    }

    // Screen wake lock: held while the sand is in use, released after cfg.wakeIdleMs without a touch, moving
    // sand or a change of tilt (a phone forgotten on a table must be allowed to sleep), taken again on activity.
    let wakeLock = null, lockTimer = 0, lockAskAt = -1e9, lockPending = false, lockFails = 0;
    function armLockWatch() {
      clearTimeout(lockTimer);
      lockTimer = setTimeout(() => {
        lockTimer = 0; if (!wakeLock) return;
        if (performance.now() - lastActive >= cfg.wakeIdleMs) releaseWakeLock(); else armLockWatch();
      }, Math.max(200, cfg.wakeIdleMs - (performance.now() - lastActive) + 40));
    }
    function requestWakeLock() {
      try {
        if (!nav.wakeLock || wakeLock || lockPending || lockFails >= 3 || document.hidden || !started || fatal) return;
        lockPending = true; lockAskAt = performance.now();
        nav.wakeLock.request('screen').then((l) => {
          lockPending = false; lockFails = 0; wakeLock = l;
          try { l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; }); } catch (e) { /* ignore */ }
          armLockWatch();
        }, () => { lockPending = false; lockFails++; });
      } catch (e) { lockPending = false; lockFails++; }
    }
    function releaseWakeLock() {
      clearTimeout(lockTimer); lockTimer = 0;
      const l = wakeLock; wakeLock = null;
      if (l) { try { const p = l.release(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
    }
    function noteActive() {
      lastActive = performance.now();
      if (!wakeLock && started && lastActive - lockAskAt > 5000) requestWakeLock();
    }

    function toast(text) {
      if (flags.noui || fatal) return;
      if (ui.toast && ui.toast.parentNode) ui.toast.parentNode.removeChild(ui.toast);
      const t = (ui.toast = el('div', 'sb-toast sb-glass')); t.setAttribute('role', 'status'); t.textContent = text; root.appendChild(t);
      setTimeout(() => t.classList.add('sb-show'), 40);
      setTimeout(() => { t.classList.remove('sb-show'); setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 600); }, 5200);
    }

    function start(gesture) {
      if (started || fatal) return;
      started = true; hooks.started = true; startedAt = performance.now();
      root.classList.add('sb-started');
      if (ui.intro) { const n = ui.intro; n.classList.add('sb-out'); setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, 1200); }
      if (gesture) { try { if (prefs.sound) audio.unlock(); } catch (e) { /* ignore */ } }
      try { requestMotion(); } catch (e) { armDetection(); }
      noteActive();
      wake(500);
    }

    // While the intro is up, drive a small throw-away sim through a stroke, a rake pass, an avalanche and a
    // shake in <= 6 ms slices, so the JIT has compiled the hot paths before the first real touch. Stops at
    // the first tap; any failure just ends it.
    function warmUp() {
      let w = null, k = 0; const N = 420, dt = 1 / 60;
      try { w = SAND.createSim({ W: 64, H: 96, cellMM: 0.5, depthMM: 6 }); w.level('dunes', true); } catch (e) { return; }
      const one = () => {
        let gx = 0, gy = 0, gz = 1;
        if (k < 180) {                                               // finger (0-89) then rake (90-179), zig-zag path
          const j = k % 90, id = k < 90 ? 1 : 2, x = 6 + 20 * Math.abs(((j / 30) % 2) - 1), y = 6 + j * 0.4;
          if (j === 0) w.touchStart(id, x, y, 5.5, -1, k < 90 ? 'finger' : 'rake'); else if (j === 89) w.touchEnd(id); else w.touchMove(id, x, y, 5.5, -1);
        } else if (k < 270) { gx = 0.6; gy = 0.2; gz = 0.77; }      // avalanche
        else if (k >= 300 && k < 380) { const a = shakeAccel((k - 300) * dt); gx = a[0]; gy = a[1]; gz = 1 + a[2]; }
        else if (k === 400) w.level('flat');                         // animated settle on purpose: warms that path up too
        w.setGravity(gx, gy, gz); w.step(dt); k++;
      };
      (function slice() {
        if (started || fatal || k >= N) { w = null; hooks.debug.warm = k; return; }
        const t0 = performance.now();
        try { do one(); while (k < N && performance.now() - t0 < 6); } catch (e) { w = null; return; }
        hooks.debug.warm = k;
        setTimeout(slice, 16);
      })();
    }

    // ------------------------------------------------------------ go
    hooks.ready = new Promise((res) => { readyDone = res; });
    // The sand is revealed on the first complete frame (the renderer may still be baking its grain atlas).
    try { if (!instant) canvas.style.transition = 'opacity .5s ease'; canvas.style.opacity = '0'; } catch (e) { /* ignore */ }
    try { layout(); } catch (err) { fail(err, 'error'); return; }   // creates the sim
    try { makeRenderer(); }
    catch (err) {
      // A driver may reject the float-target shader variants: try once more on the conservative path.
      let ok = false, last = err;
      if (String((err && err.message) || err) !== 'webgl2') { gpuRetried = true; hooks.gpuFirstError = String((err && err.message) || err);
        try { conservativeRenderer(); makeRenderer(); ok = true; } catch (e2) { last = e2; } }
      if (!ok) { fail(last); return; }
    }
    buildUI();
    if (flags.nointro || flags.noui || (nav.webdriver === true && !flags.intro)) start(false);
    else { buildIntro(); hooks.ready.then(() => setTimeout(() => { if (!started && !fatal) warmUp(); }, 350)); }

    // input
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('lostpointercapture', onUp);
    // kill every browser gesture: scroll / pull-to-refresh / pinch / double-tap zoom / callout / selection / context menu
    const stop = (e) => { if (e.cancelable) e.preventDefault(); };
    const active = { passive: false };
    canvas.addEventListener('touchstart', stop, active);
    document.addEventListener('touchmove', stop, active);
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, stop, active));
    ['contextmenu', 'dblclick', 'selectstart', 'dragstart'].forEach((n) => document.addEventListener(n, stop));
    window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, active);
    window.addEventListener('blur', () => { endAllTouches(); keys.l = keys.r = keys.u = keys.d = 0; });
    canvas.addEventListener('webglcontextlost', () => { glLost = true; watchLost(); });
    canvas.addEventListener('webglcontextrestored', () => { glLost = false; clearTimeout(lostTimer); wake(800); });

    // keyboard (desktop): arrows tilt, space shakes, Escape closes the panel
    const KEY = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' };
    window.addEventListener('keydown', (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(true); } return; }
      if (e.key === 'Escape') { closePanel(); return; }
      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if (KEY[e.key]) {
        e.preventDefault(); if (mode === 'sensor') return;
        const k = KEY[e.key];
        if (!e.repeat || !keys[k]) {
          if (locked && puckPtr == null) {                        // locked: a press nudges the held tilt; holding it keeps going (updateGravity)
            const d = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] }[k];
            let x = tilt.tx + d[0] * 0.14, y = tilt.ty + d[1] * 0.14; const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
            tilt.tx = x; tilt.ty = y;
          }
          keys[k] = 1; keyT[k] = performance.now();
        }
        wake();
      } else if ((e.key === ' ' || e.code === 'Space') && !onButton) { e.preventDefault(); if (!e.repeat) shake(); }
    });
    window.addEventListener('keyup', (e) => { if (KEY[e.key]) { keys[KEY[e.key]] = 0; wake(); } });

    // resize / rotation / visibility
    window.addEventListener('resize', () => scheduleLayout(140));
    window.addEventListener('orientationchange', () => scheduleLayout(420));
    try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => scheduleLayout(420)); } catch (e) { /* ignore */ }
    try { if (window.visualViewport) window.visualViewport.addEventListener('resize', () => scheduleLayout(140)); } catch (e) { /* ignore */ }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { endAllTouches(); if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } last = 0; }
      else { last = 0; sensor.have = false; noteActive(); requestWakeLock(); if (isLost()) watchLost(); scheduleLayout(60); wake(300); }
    });
    window.addEventListener('pageshow', () => { last = 0; wake(300); });

    wake(300);
    // Safety net: never leave the canvas hidden (or `ready` pending) because a bake reports busy for ever.
    setTimeout(() => { if (fatal || shown) return; shown = true; try { canvas.style.opacity = '1'; } catch (e) { /* ignore */ } if (readyDone) { readyDone(); readyDone = null; } }, 20000);
    // A tab opened in the background gets no rAF: finish the first frame from a timer so `ready` resolves.
    // Only when hidden - on a visible page this would turn the progressive atlas bake into one long stall.
    setTimeout(() => {
      if (!readyDone || fatal || shown || !document.hidden) return;
      try { let n = 0; do { draw(performance.now() / 1000); } while (isBusy() && !isLost() && ++n < 2000); } catch (err) { fail(err, 'gpu'); }
      if (readyDone) { readyDone(); readyDone = null; }
    }, 1500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
